name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight test dependencies (Pillow & NumPy)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow numpy

      - name: Verify Rust BC7 DDS encoder (pure std, offline)
        if: matrix.python-version == '3.12'
        env:
          CARGO_TARGET_DIR: build/dds_ci_target
        run: |
          rustc --version && cargo --version
          cargo test --manifest-path tools/dds_encoder_rs/Cargo.toml

      - name: Compile-check all Python tools & tests
        run: python3 -m py_compile tools/*.py tests/*.py

      - name: Audit repository hygiene & legal guardrails
        run: python3 tools/audit_repo_clean.py

      - name: Lint PCSX2 v2 .pnach patches
        run: python3 tools/lint_pnach.py

      - name: Verify profiles, MIPS caves, and decomp bridge
        run: |
          python3 tools/rockport_cli.py profiles
          python3 tools/rockport_cli.py decomp-bridge --out-dir build/ci_bridge --json
          python3 tools/rockport_cli.py build-caves --verify-only

      - name: Run unit test suite (offline CI mode)
        env:
          NFSMW_ISO: /nonexistent
        run: python3 -m unittest discover -s tests -v
