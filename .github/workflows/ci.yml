name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight test dependencies (Pillow & NumPy)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow numpy

      - name: Compile-check all Python tools
        run: python3 -m py_compile tools/*.py

      - name: Audit repository hygiene & legal guardrails
        run: python3 tools/audit_repo_clean.py

      - name: Lint PCSX2 v2 .pnach patches
        run: python3 tools/lint_pnach.py

      - name: Run unit test suite
        run: python3 -m unittest discover -s tests -v
